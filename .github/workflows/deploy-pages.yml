name: Deploy GitHub Pages

# The site is BUILT here rather than served straight from docs/. That is what lets
# keel stay out of this repository: the stylesheet is resolved from GitHub Packages at
# the version locked in docs/package-lock.json instead of being committed as a vendored
# artifact.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # Daily repair run so a transient Pages failure does not leave the site stale.
    - cron: "23 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read   # keel comes from GitHub Packages; without this the token has no packages scope
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: pip install --disable-pip-version-check beautifulsoup4==4.15.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@adamcoulteroz"

      # keel is published to GitHub Packages. Unlike releases or repository contents,
      # Packages supports cross-repository Actions access, so the job-scoped GITHUB_TOKEN
      # is enough once the package grants this repository read access — no PAT to create,
      # scope or rotate. If this 404s, that grant is missing.
      - name: Install keel at the locked version
        working-directory: docs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --no-audit --no-fund

      - name: Stage keel's stylesheet
        run: |
          set -euo pipefail
          cp docs/node_modules/@adamcoulteroz/keel/dist/keel.css docs/keel.bundle.css
          echo "keel $(node -p "require('./docs/node_modules/@adamcoulteroz/keel/package.json').version")"

      # The bundle is resolved, not reviewed, so prove it is the version the lockfile pins
      # rather than trusting the install did the right thing.
      - name: Verify the stylesheet matches the lockfile
        run: |
          set -euo pipefail
          locked="$(node -p "require('./docs/node_modules/@adamcoulteroz/keel/package.json').version")"
          stamped="$(head -1 docs/keel.bundle.css | grep -o 'keel v[^ ]*' | sed 's/^keel v//; s/\.$//')"
          echo "locked=$locked stamped=$stamped"
          [ "$locked" = "$stamped" ] || { echo "::error::keel.bundle.css is stamped $stamped but the lockfile resolved $locked." >&2; exit 1; }

      - name: Build the site
        run: python3 docs/redesigned/build.py

      # keel ships no aliases, so a renamed class does not error anywhere — it just stops
      # being styled. Blazor consumers get that break at compile time; a CSS-only consumer
      # like this page gets nothing. This is the missing half of that signal.
      - name: Verify every keel class and token the page uses still exists
        run: python3 docs/redesigned/check-keel-usage.py

      # Fail rather than publish a page whose stylesheet is missing: the link is relative,
      # so a missing bundle deploys an unstyled site instead of erroring.
      - name: Verify the built page
        run: |
          set -euo pipefail
          test -s docs/index.html
          test -s docs/keel.bundle.css
          grep -q 'href="keel.bundle.css"' docs/index.html
          grep -q '<title>Meridian' docs/index.html

      - name: Assemble site artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          cp docs/index.html docs/keel.bundle.css docs/robots.txt docs/sitemap.xml docs/architecture.md _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
