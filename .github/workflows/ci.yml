name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 11 SDK (preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore Meridian.slnx

      - name: Build
        run: dotnet build Meridian.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Meridian.slnx -c Release --no-build --verbosity normal
